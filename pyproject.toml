[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-socratic-tutor"
version = "0.1.0"
description = "Inspectable Socratic tutoring baseline that selects restrained hints from attempt history and an explicit mastery estimate."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
keywords = ["ai-in-education", "aied", "adaptive-learning", "socratic-tutoring", "learning-analytics"]

[project.urls]
Repository = "https://github.com/devissaputra/adaptive_socratic_tutor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
